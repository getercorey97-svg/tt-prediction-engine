name: Global Table Tennis Data Synchronization

on:
  schedule:
    # Execute daily at 00:00 UTC to pre-process global datasets
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger for immediate synchronization

jobs:
  preprocess_and_sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for accurate rolling-window processing

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests sqlite3

      - name: Execute Cloud Pre-processing (Data Lake Update)
        # This script (to be implemented) hits global APIs/sources, structures differentials, and updates SQLite/CSV
        run: |
          python scripts/cloud_data_ingestion.py 

      - name: Commit and Push Updated Databases
        run: |
          git config --global user.name "GitHub Actions - Data Sync"
          git config --global user.email "actions@github.com"
          git add data/*.csv data/*.db
          # Only commit if there are actual changes in the dataset
          git diff --quiet && git diff --staged --quiet || (git commit -m "[Auto] Sync global match results and database update" && git push)
