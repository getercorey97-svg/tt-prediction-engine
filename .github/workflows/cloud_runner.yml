name: Cloud Prediction Engine Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *' # Executes autonomously every 15 minutes

jobs:
  execute_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Mathematical & ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seeding Protocol & Model Calibration
        run: python scripts/seed_and_train.py

      - name: Queue Live and Upcoming Matches
        run: python scripts/live_site_scraper.py

      - name: Execute Pure Math Synthesis & Evaluator
        run: python src/main_runner.py

      - name: Commit and Push Calibrated Artifacts & Databases
        run: |
          git config --global user.name "GitHub Actions - Engine"
          git config --global user.email "actions@github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "[Auto] Calibrate model, queue matches, and push predictions" && git push)
