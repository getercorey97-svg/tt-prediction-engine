name: Cloud Prediction Engine Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  execute_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Mathematical & ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Unified Pipeline (Queue, Predict & Alert)
        run: python src/unified_engine.py --predict

      - name: Commit and Push Calibrated Artifacts & Databases
        run: |
          git config --global user.name "GitHub Actions - Engine"
          git config --global user.email "actions@github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "[Auto] Dual-tier queue, isotonic prediction cycle, and learning update" && git push)
