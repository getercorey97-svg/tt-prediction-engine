name: On-Demand Match Predictor

on:
  workflow_dispatch:
    inputs:
      player_a:
        description: 'Player A Name (e.g., Tomokazu Harimoto)'
        required: true
        type: string
      player_b:
        description: 'Player B Name (e.g., Hugo Calderano)'
        required: true
        type: string

jobs:
  run-prediction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compute Match Prediction
        run: python scripts/predict_match.py --player-a "${{ github.event.inputs.player_a }}" --player-b "${{ github.event.inputs.player_b }}"
